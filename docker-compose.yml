services:
  tilorama:
    # `docker compose pull` fetches the prebuilt image; `docker compose up -d --build` builds it
    # from this checkout instead.
    image: ${TILORAMA_IMAGE:-ghcr.io/tunefish92/tilorama:latest}
    build: .
    container_name: tilorama
    restart: unless-stopped
    environment:
      # Owner of the data folder on the host; the app runs as this user.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    ports:
      # Tilorama has no login: everyone who can reach this port can open images and clear the
      # cache. Bound to this machine only; change to "8080:8080" to share it on a trusted network.
      - "${TILORAMA_PORT:-127.0.0.1:8080}:8080"
    volumes:
      # Uploaded originals, tiles and settings.
      - ${TILORAMA_DATA_HOST_PATH:-./tilorama-data}:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
