name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # "Run workflow" in the Actions tab: on main it refreshes the Docker Hub description, on a
  # release tag it republishes that release's image. On other branches it only builds and tests.
  workflow_dispatch:

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install
        run: npm ci && npm --prefix client ci

      # Backend tests, lint and a type-checked client build.
      - name: Test
        run: npm test

  docker-build:
    name: Docker image build & smoke test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7

      - name: Build image (not pushed)
        run: docker build -t tilorama:ci .

      # Starts the image with a root-owned data folder (what Docker creates for a missing bind
      # mount) and checks that the entrypoint hands it to the app user, the app comes up and
      # libvips cuts an image into tiles.
      - name: Smoke test
        run: |
          sudo mkdir -p /tmp/tilorama-data
          docker run -d --name tilorama -p 8080:8080 -v /tmp/tilorama-data:/data tilorama:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

          test "$(stat -c '%u:%g' /tmp/tilorama-data)" = "1000:1000"
          docker top tilorama -eo pid,uid,args | grep -Eq '^\s*[0-9]+\s+1000\s+dotnet /app/Tilorama\.Server\.dll'
          curl -fsS http://localhost:8080/ | grep -q '<title>Tilorama</title>'

          curl -fsS -X POST -H 'Content-Type: application/octet-stream' -H 'X-File-Name: favicon.svg' \
            --data-binary @client/public/favicon.svg http://localhost:8080/api/images > /tmp/open.json
          cat /tmp/open.json
          image=$(grep -o '"imageId":"[^"]*"' /tmp/open.json | cut -d'"' -f4)
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:8080/api/images/$image" > /tmp/image.json; then break; fi
            sleep 2
          done
          grep -q '"tileCount":' /tmp/image.json
          curl -fsS -o /dev/null "http://localhost:8080/tiles/$image/thumb.webp"

      - name: Container logs
        if: always()
        run: docker logs tilorama || true

  docker-publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # The app compares its own version with the GitHub releases, so tag and version must agree.
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./client/package.json').version")" = "$GITHUB_REF_NAME"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional second registry: set the DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN secret.
      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Only releases are published: tag v1.2.3 → 1.2.3 and latest (pre-releases like v1.3.0-beta
      # don't move latest). Pushes to main only refresh the Docker Hub description below.
      - name: Image tags
        id: meta
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ vars.DOCKERHUB_USERNAME != '' && format('{0}/tilorama', vars.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=semver,pattern={{version}}

      - name: Set up QEMU
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Docker Hub's overview and short description, from docs/dockerhub.md. Editing them needs a
      # DOCKERHUB_TOKEN with the "Read, Write, Delete" scope.
      - name: Update Docker Hub description
        if: vars.DOCKERHUB_USERNAME != ''
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/tilorama
          readme-filepath: ./docs/dockerhub.md
          short-description: Fast deep-zoom viewer for gigapixel images, tiled by libvips and rendered with OpenSeadragon.
